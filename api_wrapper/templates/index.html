<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Student Performance Analyzer</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Student Performance Analyzer</h1>
        <form action="/" method="post">
            <div class="row mb-3">
                <label for="Hours_Studied" class="col-sm-3 col-form-label">Hours Studied (per week average):</label>
                <div class="col-sm-9">
                    <input type="number" name="Hours_Studied" id="Hours_Studied" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Attendance" class="col-sm-3 col-form-label">Attendance (in %):</label>
                <div class="col-sm-9">
                    <input type="number" name="Attendance" id="Attendance" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Parental_Involvement" class="col-sm-3 col-form-label">Parental Involvement:</label>
                <div class="col-sm-9">
                    <select name="Parental_Involvement" id="Parental_Involvement" class="form-select" required>
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="0">High</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Access_to_Resources" class="col-sm-3 col-form-label">Access to Resources:</label>
                <div class="col-sm-9">
                    <select name="Access_to_Resources" id="Access_to_Resources" class="form-select" required>
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="0">High</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Extracurricular_Activities" class="col-sm-3 col-form-label">Extracurricular Activities:</label>
                <div class="col-sm-9">
                    <select name="Extracurricular_Activities" id="Extracurricular_Activities" class="form-select" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Sleep_Hours" class="col-sm-3 col-form-label">Sleep Hours (per night average):</label>
                <div class="col-sm-9">
                    <input type="number" name="Sleep_Hours" id="Sleep_Hours" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Previous_Scores" class="col-sm-3 col-form-label">Previous Scores:</label>
                <div class="col-sm-9">
                    <input type="number" name="Previous_Scores" id="Previous_Scores" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Motivation_Level" class="col-sm-3 col-form-label">Motivation Level:</label>
                <div class="col-sm-9">
                    <select name="Motivation_Level" id="Motivation_Level" class="form-select" required>
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="0">High</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Internet_Access" class="col-sm-3 col-form-label">Internet Access:</label>
                <div class="col-sm-9">
                    <select name="Internet_Access" id="Internet_Access" class="form-select" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Tutoring_Sessions" class="col-sm-3 col-form-label">Tutoring Sessions (per week):</label>
                <div class="col-sm-9">
                    <input type="number" name="Tutoring_Sessions" id="Tutoring_Sessions" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Family_Income" class="col-sm-3 col-form-label">Family Income:</label>
                <div class="col-sm-9">
                    <select name="Family_Income" id="Family_Income" class="form-select" required>
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="0">High</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Teacher_Quality" class="col-sm-3 col-form-label">Teacher Quality:</label>
                <div class="col-sm-9">
                    <select name="Teacher_Quality" id="Teacher_Quality" class="form-select" required>
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="0">High</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="School_Type" class="col-sm-3 col-form-label">School Type:</label>
                <div class="col-sm-9">
                    <select name="School_Type" id="School_Type" class="form-select" required>
                        <option value="1">Public</option>
                        <option value="0">Private</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Peer_Influence" class="col-sm-3 col-form-label">Peer Influence:</label>
                <div class="col-sm-9">
                    <select name="Peer_Influence" id="Peer_Influence" class="form-select" required>
                        <option value="2">Positive</option>
                        <option value="1">Neutral</option>
                        <option value="0">Negative</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Physical_Activity" class="col-sm-3 col-form-label">Physical Activity (in hours, per week average):</label>
                <div class="col-sm-9">
                    <input type="number" name="Physical_Activity" id="Physical_Activity" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Learning_Disabilities" class="col-sm-3 col-form-label">Learning Disabilities:</label>
                <div class="col-sm-9">
                    <select name="Learning_Disabilities" id="Learning_Disabilities" class="form-select" required>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <label for="Parental_Education_Level" class="col-sm-3 col-form-label">Parental Education Level:</label>
                <div class="col-sm-9">
                    <select name="Parental_Education_Level" id="Parental_Education_Level" class="form-select" required>
                        <option value="1">High school</option>
                        <option value="0">College</option>
                        <option value="2">Postgraduate</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <label for="Distance_from_Home" class="col-sm-3 col-form-label">Distance from Home (of school):</label>
                <div class="col-sm-9">
                    <select name="Distance_from_Home" id="Distance_from_Home" class="form-select" required>
                        <option value="2">Near</option>
                        <option value="1">Moderate</option>
                        <option value="0">Far</option>
                    </select>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Analyze</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
