<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Student Performance Analyzer</title>
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- Header Section -->
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Student Performance Analyzer</h1>
            <p class="text-muted mx-auto" style="max-width: 600px;">
                Fill out the metrics below to generate a comprehensive student performance evaluation.
            </p>
        </div>

        <!-- Main Form Card -->
        <div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 960px;">
            <div class="card-body p-4 p-md-5">
                <form action="/" method="post">
                    
                    <div class="row g-4 mb-4">
                        <!-- Hours Studied -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Hours_Studied" class="form-label fw-semibold text-secondary">Hours Studied (per week average):</label>
                            <input type="number" name="Hours_Studied" id="Hours_Studied" class="form-control" required>
                        </div>

                        <!-- Attendance -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Attendance" class="form-label fw-semibold text-secondary">Attendance (in %):</label>
                            <input type="number" name="Attendance" id="Attendance" class="form-control" required>
                        </div>

                        <!-- Parental Involvement -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Parental_Involvement" class="form-label fw-semibold text-secondary">Parental Involvement:</label>
                            <select name="Parental_Involvement" id="Parental_Involvement" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Low</option>
                                <option value="2">Medium</option>
                                <option value="0">High</option>
                            </select>
                        </div>

                        <!-- Access to Resources -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Access_to_Resources" class="form-label fw-semibold text-secondary">Access to Resources:</label>
                            <select name="Access_to_Resources" id="Access_to_Resources" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Low</option>
                                <option value="2">Medium</option>
                                <option value="0">High</option>
                            </select>
                        </div>

                        <!-- Extracurricular Activities -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Extracurricular_Activities" class="form-label fw-semibold text-secondary">Extracurricular Activities:</label>
                            <select name="Extracurricular_Activities" id="Extracurricular_Activities" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <!-- Sleep Hours -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Sleep_Hours" class="form-label fw-semibold text-secondary">Sleep Hours (per night average):</label>
                            <input type="number" name="Sleep_Hours" id="Sleep_Hours" class="form-control" required>
                        </div>

                        <!-- Previous Scores -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Previous_Scores" class="form-label fw-semibold text-secondary">Previous Scores:</label>
                            <input type="number" name="Previous_Scores" id="Previous_Scores" class="form-control" required>
                        </div>

                        <!-- Motivation Level -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Motivation_Level" class="form-label fw-semibold text-secondary">Motivation Level:</label>
                            <select name="Motivation_Level" id="Motivation_Level" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Low</option>
                                <option value="2">Medium</option>
                                <option value="0">High</option>
                            </select>
                        </div>

                        <!-- Internet Access -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Internet_Access" class="form-label fw-semibold text-secondary">Internet Access:</label>
                            <select name="Internet_Access" id="Internet_Access" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <!-- Tutoring Sessions -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Tutoring_Sessions" class="form-label fw-semibold text-secondary">Tutoring Sessions (per week):</label>
                            <input type="number" name="Tutoring_Sessions" id="Tutoring_Sessions" class="form-control" required>
                        </div>

                        <!-- Family Income -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Family_Income" class="form-label fw-semibold text-secondary">Family Income:</label>
                            <select name="Family_Income" id="Family_Income" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Low</option>
                                <option value="2">Medium</option>
                                <option value="0">High</option>
                            </select>
                        </div>

                        <!-- Teacher Quality -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Teacher_Quality" class="form-label fw-semibold text-secondary">Teacher Quality:</label>
                            <select name="Teacher_Quality" id="Teacher_Quality" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Low</option>
                                <option value="2">Medium</option>
                                <option value="0">High</option>
                            </select>
                        </div>

                        <!-- School Type -->
                        <div class="col-md-6 col-lg-4">
                            <label for="School_Type" class="form-label fw-semibold text-secondary">School Type:</label>
                            <select name="School_Type" id="School_Type" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Public</option>
                                <option value="0">Private</option>
                            </select>
                        </div>

                        <!-- Peer Influence -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Peer_Influence" class="form-label fw-semibold text-secondary">Peer Influence:</label>
                            <select name="Peer_Influence" id="Peer_Influence" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="2">Positive</option>
                                <option value="1">Neutral</option>
                                <option value="0">Negative</option>
                            </select>
                        </div>

                        <!-- Physical Activity -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Physical_Activity" class="form-label fw-semibold text-secondary">Physical Activity (hours/wk avg):</label>
                            <input type="number" name="Physical_Activity" id="Physical_Activity" class="form-control" required>
                        </div>

                        <!-- Learning Disabilities -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Learning_Disabilities" class="form-label fw-semibold text-secondary">Learning Disabilities:</label>
                            <select name="Learning_Disabilities" id="Learning_Disabilities" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <!-- Parental Education Level -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Parental_Education_Level" class="form-label fw-semibold text-secondary">Parental Education Level:</label>
                            <select name="Parental_Education_Level" id="Parental_Education_Level" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="1">High school</option>
                                <option value="0">College</option>
                                <option value="2">Postgraduate</option>
                            </select>
                        </div>

                        <!-- Distance from Home -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Distance_from_Home" class="form-label fw-semibold text-secondary">Distance from Home (of school):</label>
                            <select name="Distance_from_Home" id="Distance_from_Home" class="form-select" required>
                                <option value="" selected disabled></option>
                                <option value="2">Near</option>
                                <option value="1">Moderate</option>
                                <option value="0">Far</option>
                            </select>
                        </div>
                    </div>

                    <!-- Submit Button Section -->
                    <div class="text-center pt-4 border-top">
                        <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm fw-semibold rounded-pill">
                            Analyze
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
