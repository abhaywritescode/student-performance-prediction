<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Student Performance Analyzer</title>
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <!-- Performance Report Card -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    
                    <!-- Card Header -->
                    <div class="card-body text-center pt-5 px-4">
                        <h1 class="h5 fw-bold text-primary text-uppercase mb-1" style="letter-spacing: 0.05em;">Performance Report</h1>
                        <p class="text-muted small mb-0">Analyzed Result Metrics</p>
                    </div>
                    
                    <!-- Card Body -->
                    <div class="card-body text-center pb-5 px-4 pt-3">
                        
                        <!-- Main Score Display -->
                        <div class="my-4 py-3 bg-light rounded-3">
                            <h2 class="display-4 fw-bold text-dark mb-0">
                                {{ "%.2f"|format(result[0]) }}%
                            </h2>
                        </div>
                        
                        <!-- Success Feedback Status -->
                        <div class="alert alert-success border-0 bg-success-subtle text-success py-2 px-3 small rounded-3 mb-4" role="alert">
                            Evaluation completed successfully.
                        </div>
                        
                        <!-- Navigation Action -->
                        <div class="d-grid gap-2">
                            <a href="/" class="btn btn-primary btn-lg fs-6 fw-semibold rounded-pill shadow-sm px-4 py-2">
                                Analyze Another Student
                            </a>
                        </div>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
